server {
    listen 80;
    listen [::]:80;
    server_name shiftchef.185-209-222-223.sslip.io;

    return 301 https://shiftchef.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shiftchef.185-209-222-223.sslip.io;

    ssl_certificate /etc/letsencrypt/live/shiftchef.185-209-222-223.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiftchef.185-209-222-223.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shiftchef.app$request_uri;
}
