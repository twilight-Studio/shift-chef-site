version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://${AWS_BRANCH}.${AWS_APP_ID}.amplifyapp.com}"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
